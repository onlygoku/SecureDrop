<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SecureDrop private file encryption"
    >

    <title>SecureDrop</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >
</head>


<body>

    <!-- =====================================================
         DYNAMIC BACKGROUND
    ====================================================== -->

    <div
        class="ambient-background"
        aria-hidden="true"
    >

        <div class="ambient-orb orb-one"></div>

        <div class="ambient-orb orb-two"></div>

        <div class="ambient-orb orb-three"></div>

        <div class="ambient-grid"></div>

        <div
            id="ambientParticles"
            class="ambient-particles"
        ></div>

    </div>


    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <div class="app">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">

            <div class="brand">

                <h1 class="brand-title">
                    SecureDrop
                </h1>

                <p class="brand-subtitle">
                    Private file encryption.
                </p>

            </div>


            <button
                id="themeToggle"
                class="theme-toggle"
                type="button"
                aria-label="Toggle theme"
            >
                ☼
            </button>

        </header>


        <!-- =================================================
             MODE SWITCH
        ================================================== -->

        <div
            class="mode-switch"
            role="tablist"
            aria-label="Operation mode"
        >

            <button
                id="encryptMode"
                class="mode-button active"
                type="button"
                role="tab"
                aria-selected="true"
            >
                Encrypt
            </button>


            <button
                id="decryptMode"
                class="mode-button"
                type="button"
                role="tab"
                aria-selected="false"
            >
                Decrypt
            </button>

        </div>


        <!-- =================================================
             MAIN CARD
        ================================================== -->

        <main class="card">

            <!-- =============================================
                 DROP ZONE
            ============================================== -->

            <div
                id="dropZone"
                class="drop-zone"
            >

                <div class="drop-content">

                    <div
                        class="drop-icon"
                        aria-hidden="true"
                    >
                        +
                    </div>


                    <h2
                        id="dropTitle"
                        class="drop-title"
                    >
                        Drop files here
                    </h2>


                    <p
                        id="dropSubtitle"
                        class="drop-subtitle"
                    >
                        or click to choose files from your device
                    </p>


                    <button
                        id="chooseFiles"
                        class="primary-button"
                        type="button"
                    >
                        Choose file
                    </button>

                </div>

            </div>


            <!-- =============================================
                 FILE INPUT
            ============================================== -->

            <input
                id="fileInput"
                type="file"
            >


            <!-- =============================================
                 FILE LIST
            ============================================== -->

            <div
                id="fileList"
                class="file-list"
            ></div>


            <!-- =============================================
                 PASSWORD
            ============================================== -->

            <section class="form-section">

                <div class="field">

                    <label
                        class="field-label"
                        for="password"
                    >
                        Password
                    </label>


                    <div class="input-wrapper">

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter a strong password"
                            autocomplete="new-password"
                            spellcheck="false"
                        >


                        <button
                            id="showPassword"
                            class="show-password"
                            type="button"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Confirm password -->

                <div
                    id="confirmField"
                    class="field"
                >

                    <label
                        class="field-label"
                        for="confirmPassword"
                    >
                        Confirm password
                    </label>


                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                        spellcheck="false"
                    >

                </div>

            </section>


            <!-- =============================================
                 PROGRESS
            ============================================== -->

            <section
                id="progressSection"
                class="progress-section"
                hidden
                aria-live="polite"
            >

                <div class="progress-track">

                    <div
                        id="progressBar"
                        class="progress-bar"
                    ></div>

                </div>


                <div class="progress-text">

                    <span id="status">
                        Ready
                    </span>


                    <span id="progressPercent">
                        0%
                    </span>

                </div>

            </section>


            <!-- =============================================
                 ACTIONS
            ============================================== -->

            <div class="action-row">

                <div class="status">

                    <span id="fileStatus">
                        No files selected
                    </span>

                </div>


                <div class="action-group">

                    <button
                        id="clearButton"
                        class="secondary-button"
                        type="button"
                    >
                        Clear
                    </button>


                    <button
                        id="actionButton"
                        class="primary-button"
                        type="button"
                    >
                        Encrypt
                    </button>

                </div>

            </div>

        </main>

    </div>


    <!-- =====================================================
         ARGON2
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>


    <!-- =====================================================
         APPLICATION JS
    ====================================================== -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>

</html>
