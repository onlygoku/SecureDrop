<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureDrop</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <div class="brand">
            <h1 class="brand-title">SecureDrop</h1>
            <p class="brand-subtitle">
                Private file encryption. Nothing leaves your device.
            </p>
        </div>

        <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-label="Toggle theme"
        >
            ☼
        </button>

    </header>


    <!-- Encrypt / Decrypt -->
    <div class="mode-switch">

        <button
            id="encryptMode"
            class="mode-button active"
            type="button"
        >
            Encrypt
        </button>

        <button
            id="decryptMode"
            class="mode-button"
            type="button"
        >
            Decrypt
        </button>

    </div>


    <!-- Main Card -->
    <main class="card">

        <!-- Drop Zone -->
        <div
            id="dropZone"
            class="drop-zone"
        >

            <div class="drop-content">

                <div class="drop-icon">
                    +
                </div>

                <h2 class="drop-title">
                    Drop files here
                </h2>

                <p class="drop-subtitle">
                    or click to choose files from your device
                </p>

                <button
                    id="chooseFiles"
                    class="primary-button"
                    type="button"
                >
                    Choose files
                </button>

            </div>

        </div>


        <!-- Hidden File Input -->
        <input
            id="fileInput"
            type="file"
            multiple
        >


        <!-- File List -->
        <div
            id="fileList"
            class="file-list"
        ></div>


        <!-- Password -->
        <section class="form-section">

            <div class="field">

                <label
                    class="field-label"
                    for="password"
                >
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter a strong password"
                        autocomplete="new-password"
                    >

                    <button
                        id="showPassword"
                        class="show-password"
                        type="button"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- Confirm Password -->
            <div
                id="confirmField"
                class="field"
            >

                <label
                    class="field-label"
                    for="confirmPassword"
                >
                    Confirm password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                >

            </div>

        </section>


        <!-- Progress -->
        <section class="progress-section">

            <div class="progress-track">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

            <div class="progress-text">

                <span id="status">
                    Preparing...
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

        </section>


        <!-- Actions -->
        <div class="action-row">

            <div class="status">
                <span id="fileStatus">
                    No files selected
                </span>
            </div>

            <div class="action-group">

                <button
                    id="clearButton"
                    class="secondary-button"
                    type="button"
                >
                    Clear
                </button>

                <button
                    id="actionButton"
                    class="primary-button"
                    type="button"
                >
                    Encrypt
                </button>

            </div>

        </div>

    </main>


    

</div>


<script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
